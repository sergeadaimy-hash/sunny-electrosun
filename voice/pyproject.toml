[project]
name = "sunny-voice"
version = "0.1.0"
description = "Sunny voice sidecar: WhatsApp Business Calling bot for Electro-Sun (Pipecat)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,cartesia,deepgram,silero,webrtc]>=1.4.0",
    "fastapi>=0.115.6,<0.117.0",
    "uvicorn>=0.32.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "aiohttp>=3.9.0",
    "loguru>=0.7.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I"]
